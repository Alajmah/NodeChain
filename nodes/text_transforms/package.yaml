# Text Transforms Package -- multi-node package with capabilities

package_id: text-transforms
version: "1.0.0"
nodechain_min_version: "0.3.4"

capabilities:
  network: false
  filesystem: none
  memory_write: false
  external_api: false
  subprocess: false
  gpu: false

dependencies:
  python: []
  packages: []

entrypoints:
  - node_id: uppercase_node
    implementation: implementations.uppercase:UppercaseNode
    side_effects: []

  - node_id: reverse_node
    implementation: implementations.reverse:ReverseNode
    side_effects: []

meta:
  author: NodeChain
  license: MIT
  tags: [text, transforms, example]
  compatibility_version: "1.0.0"

nodes:
  - manifest:
      node_id: uppercase_node
      node_type: deterministic
      name: Uppercase Node
      description: Converts input query to uppercase.
      version: "1.0.0"
      tags: [text, uppercase]
    contract:
      contract_id: transforms.uppercase.v1
      version: "1.0.0"
      entry:
        input_type: raw_user_query
        schema_ref: "nodechain://schemas/semantic_types/raw_user_query"
        required_fields:
          - query
      exit:
        output_type: raw_user_query
        schema_ref: "nodechain://schemas/semantic_types/raw_user_query"
        guaranteed_fields:
          - query
          - transformed
      side_effects: []
      requirements:
        model_required: false
        memory_access: none
        trust_level: trusted
    implementation: uppercase.py
    test: test_uppercase.py

  - manifest:
      node_id: reverse_node
      node_type: deterministic
      name: Reverse Node
      description: Reverses the input query string.
      version: "1.0.0"
      tags: [text, reverse]
    contract:
      contract_id: transforms.reverse.v1
      version: "1.0.0"
      entry:
        input_type: raw_user_query
        schema_ref: "nodechain://schemas/semantic_types/raw_user_query"
        required_fields:
          - query
      exit:
        output_type: raw_user_query
        schema_ref: "nodechain://schemas/semantic_types/raw_user_query"
        guaranteed_fields:
          - query
          - transformed
      side_effects: []
      requirements:
        model_required: false
        memory_access: none
        trust_level: trusted
    implementation: reverse.py
    test: test_reverse.py
