# Shared Risk Classifier — reusable governed node package (v2.61.0)
#
# This node is domain-neutral: it accepts a canonical RISK_CONTEXT and
# produces a RISK_ASSESSMENT. Domain-specific chains use adapters to
# normalize their domain data into RISK_CONTEXT before invoking this node.
#
# Build a node once. Govern it forever. Reuse it everywhere.

manifest:
  node_id: shared_risk_classifier
  node_type: deterministic
  name: Shared Risk Classifier
  description: >
    Domain-neutral risk classifier that accepts a canonical RISK_CONTEXT
    and produces a RISK_ASSESSMENT. Reusable across research, incident
    response, security audit, and fact-checking chains.
  version: "1.0.0"
  tags: [shared, risk, classifier, reusable, cross-domain]

contract:
  contract_id: shared.risk-classifier.v1
  version: "1.0.0"
  entry:
    input_type: risk_context
    schema_ref: "nodechain://schemas/semantic_types/risk_context"
    required_fields:
      - domain
      - subject
      - severity_signals
  exit:
    output_type: risk_assessment
    schema_ref: "nodechain://schemas/semantic_types/risk_assessment"
    guaranteed_fields:
      - risk_level
      - confidence
      - review_required

requirements:
  model_required: false
  memory_access: "none"

side_effects: []

capabilities:
  network: false
  filesystem: "none"
  memory_write: false
  external_api: false
  subprocess: false
  gpu: false

trust_level: trusted
nodechain_min_version: "2.61.0"
