name: Publication Tree

# Portable publication and package smoke gate. Runs exclusively on
# GitHub-hosted runners. This workflow asserts that the committed tree
# satisfies the clean-publication policy and that the package builds and
# imports on GitHub-hosted Ubuntu and Windows runners.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: publication-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-tree:
    name: publication tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Install development test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run publication-tree guard against committed HEAD
        run: python scripts/check_publication_tree.py --ref HEAD

      - name: Run publication-guard tests
        run: python -m pytest tests/test_publication_tree_guard.py -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Assert exactly one wheel and one sdist produced
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 wheel, found ${#wheels[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 sdist, found ${#sdists[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          echo "wheel: ${wheels[0]}"
          echo "sdist: ${sdists[0]}"

      - name: Create empty smoke virtual environment
        shell: bash
        run: |
          python -m venv smoke-env

      - name: Install wheel into smoke environment
        shell: bash
        run: |
          # Use the venv's python directly without activating, for OS-portability.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="smoke-env/bin/python"
          fi
          wheel=$(ls dist/*.whl | head -n1)
          "$SMOKE_PY" -m pip install --upgrade pip
          "$SMOKE_PY" -m pip install "$wheel"

      - name: Assert nodechain version and CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="smoke-env/bin/python"
          fi
          version=$("$SMOKE_PY" -c "import nodechain; print(nodechain.__version__)")
          if [ "$version" != "3.6.0" ]; then
            echo "ERROR: expected nodechain.__version__ == 3.6.0, got $version" >&2
            exit 1
          fi
          echo "nodechain.__version__ == $version"
          # Verify the installed console script resolves and reports the same version.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cli_version=$(smoke-env/Scripts/nodechain.exe --version)
          else
            cli_version=$(smoke-env/bin/nodechain --version)
          fi
          echo "nodechain --version: $cli_version"

      - name: Assert installed-wheel schema validation and artifact parity
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="$(pwd)/smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="$(pwd)/smoke-env/bin/python"
          fi

          # --- Artifact-set parity: source vs wheel vs sdist ---
          "$SMOKE_PY" -c "
          import sys, zipfile, tarfile
          from pathlib import Path

          repo = Path('.')
          source_schemas = sorted(
              str(p.relative_to('schemas')).replace(chr(92), '/')
              for p in (repo / 'schemas').rglob('*.json')
          )

          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as z:
              wheel_schemas = sorted(
                  n.replace('nodechain/schemas/', '')
                  for n in z.namelist()
                  if 'nodechain/schemas/' in n and n.endswith('.json')
              )

          sdist = next(Path('dist').glob('*.tar.gz'))
          with tarfile.open(sdist) as t:
              sdist_schemas = sorted(
                  n.split('/schemas/', 1)[-1]
                  for n in t.getnames()
                  if '/schemas/' in n and n.endswith('.json')
                  and '/nodechain/schemas/' not in n
                  and 'src/nodechain' not in n
                  and 'nodes/' not in n
              )

          print(f'source runtime schemas: {len(source_schemas)}')
          print(f'wheel runtime schemas: {len(wheel_schemas)}')
          print(f'sdist runtime schemas: {len(sdist_schemas)}')

          sw_diff = set(source_schemas) - set(wheel_schemas)
          ws_diff = set(wheel_schemas) - set(source_schemas)
          ss_diff = set(source_schemas) - set(sdist_schemas)
          sd_diff = set(sdist_schemas) - set(source_schemas)

          print(f'source-only vs wheel: {sorted(sw_diff)}')
          print(f'wheel-only vs source: {sorted(ws_diff)}')
          print(f'source-only vs sdist: {sorted(ss_diff)}')
          print(f'sdist-only vs source: {sorted(sd_diff)}')

          if source_schemas != wheel_schemas:
              print('ERROR: source != wheel schema sets', file=sys.stderr)
              sys.exit(1)
          if source_schemas != sdist_schemas:
              print('ERROR: source != sdist schema sets', file=sys.stderr)
              sys.exit(1)
          print('Artifact-set parity: PASS')
          "

          # --- Installed-wheel schema proof (outside checkout, no PYTHONPATH) ---
          unset PYTHONPATH
          PROOF_DIR="$(mktemp -d)"
          cd "$PROOF_DIR"
          "$SMOKE_PY" -c "
          import sys, os
          from pathlib import Path
          import nodechain
          from nodechain.validation.schema_validator import SCHEMA_ROOT, SchemaValidator

          # 1. Assert SCHEMA_ROOT is exactly inside the installed package
          expected = Path(nodechain.__file__).resolve().parent / 'schemas'
          actual = SCHEMA_ROOT.resolve()
          if actual != expected:
              print(f'ERROR: SCHEMA_ROOT {actual} != expected {expected}', file=sys.stderr)
              sys.exit(1)
          if not actual.is_dir():
              print(f'ERROR: SCHEMA_ROOT {actual} does not exist', file=sys.stderr)
              sys.exit(1)
          print(f'SCHEMA_ROOT: {actual}')

          # 2. Assert all schemas load
          sv = SchemaValidator()
          errors = sv.validate_all_schemas_loadable()
          if errors:
              print(f'ERROR: schema load errors: {errors}', file=sys.stderr)
              sys.exit(1)
          schema_count = len(list(actual.rglob('*.json')))
          print(f'All {schema_count} schemas loaded successfully')

          # 3. Valid payload passes
          ref = 'nodechain://schemas/semantic_types/raw_user_query'
          valid_result = sv.validate({'query': 'release schema smoke'}, ref)
          if not valid_result:
              print(f'ERROR: valid payload rejected: {valid_result.errors}', file=sys.stderr)
              sys.exit(1)
          print('Valid payload accepted')

          # 4. Invalid payload fails with schema error, NOT 'Schema not found'
          invalid_result = sv.validate({'query': ''}, ref)
          if invalid_result:
              print('ERROR: invalid payload was accepted', file=sys.stderr)
              sys.exit(1)
          if any('Schema not found' in e for e in invalid_result.errors):
              print(f'ERROR: schema not found from installed wheel: {invalid_result.errors}', file=sys.stderr)
              sys.exit(1)
          print(f'Invalid payload correctly rejected: {invalid_result.errors}')
          "
