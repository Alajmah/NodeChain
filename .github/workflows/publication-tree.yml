name: Publication Tree

# Portable publication and package smoke gate. Runs exclusively on
# GitHub-hosted runners. This workflow asserts that the committed tree
# satisfies the clean-publication policy and that the package builds and
# imports on GitHub-hosted Ubuntu and Windows runners.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: publication-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-tree:
    name: publication tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Install development test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run publication-tree guard against committed HEAD
        run: python scripts/check_publication_tree.py --ref HEAD

      - name: Run publication-guard tests
        run: python -m pytest tests/test_publication_tree_guard.py -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Assert exactly one wheel and one sdist produced
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 wheel, found ${#wheels[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 sdist, found ${#sdists[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          echo "wheel: ${wheels[0]}"
          echo "sdist: ${sdists[0]}"

      - name: Create empty smoke virtual environment
        shell: bash
        run: |
          python -m venv smoke-env

      - name: Install wheel into smoke environment
        shell: bash
        run: |
          # Use the venv's python directly without activating, for OS-portability.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="smoke-env/bin/python"
          fi
          wheel=$(ls dist/*.whl | head -n1)
          "$SMOKE_PY" -m pip install --upgrade pip
          "$SMOKE_PY" -m pip install "$wheel"

      - name: Assert nodechain version and CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="smoke-env/bin/python"
          fi
          version=$("$SMOKE_PY" -c "import nodechain; print(nodechain.__version__)")
          if [ "$version" != "3.5.1" ]; then
            echo "ERROR: expected nodechain.__version__ == 3.5.1, got $version" >&2
            exit 1
          fi
          echo "nodechain.__version__ == $version"
          # Verify the installed console script resolves and reports the same version.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cli_version=$(smoke-env/Scripts/nodechain.exe --version)
          else
            cli_version=$(smoke-env/bin/nodechain --version)
          fi
          echo "nodechain --version: $cli_version"
