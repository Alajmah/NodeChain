name: Publication Tree

# Portable publication and package smoke gate. Runs exclusively on
# GitHub-hosted runners. This workflow asserts that the committed tree
# satisfies the clean-publication policy and that the package builds and
# imports on GitHub-hosted Ubuntu and Windows runners.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: publication-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-tree:
    name: publication tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Install development test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run publication-tree guard against committed HEAD
        run: python scripts/check_publication_tree.py --ref HEAD

      - name: Run publication-guard tests
        run: python -m pytest tests/test_publication_tree_guard.py -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Assert exactly one wheel and one sdist produced
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 wheel, found ${#wheels[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 sdist, found ${#sdists[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          echo "wheel: ${wheels[0]}"
          echo "sdist: ${sdists[0]}"

      - name: Create empty smoke virtual environment
        shell: bash
        run: |
          python -m venv smoke-env

      - name: Install wheel into smoke environment
        shell: bash
        run: |
          # Use the venv's python directly without activating, for OS-portability.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="smoke-env/bin/python"
          fi
          wheel=$(ls dist/*.whl | head -n1)
          "$SMOKE_PY" -m pip install --upgrade pip
          "$SMOKE_PY" -m pip install "$wheel"

      - name: Assert nodechain version and CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="smoke-env/bin/python"
          fi
          version=$("$SMOKE_PY" -c "import nodechain; print(nodechain.__version__)")
          if [ "$version" != "3.6.0" ]; then
            echo "ERROR: expected nodechain.__version__ == 3.6.0, got $version" >&2
            exit 1
          fi
          echo "nodechain.__version__ == $version"
          # Verify the installed console script resolves and reports the same version.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cli_version=$(smoke-env/Scripts/nodechain.exe --version)
          else
            cli_version=$(smoke-env/bin/nodechain --version)
          fi
          echo "nodechain --version: $cli_version"

      - name: Assert installed-wheel schema validation
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_PY="$(pwd)/smoke-env/Scripts/python.exe"
          else
            SMOKE_PY="$(pwd)/smoke-env/bin/python"
          fi
          # Run from a directory outside the repository checkout to prove
          # schemas resolve from the installed wheel, not the source tree.
          PROOF_DIR="$(mktemp -d)"
          cd "$PROOF_DIR"
          "$SMOKE_PY" -c "
          import sys, os
          from nodechain.validation.schema_validator import SCHEMA_ROOT, SchemaValidator
          # 1. Assert schema root is inside the installed package
          nc_parent = os.path.dirname(os.path.dirname(os.path.dirname(SCHEMA_ROOT)))
          if 'nodechain' not in os.path.basename(nc_parent) and 'site-packages' not in str(SCHEMA_ROOT):
              print(f'ERROR: SCHEMA_ROOT {SCHEMA_ROOT} is not inside the installed package', file=sys.stderr)
              sys.exit(1)
          if not SCHEMA_ROOT.is_dir():
              print(f'ERROR: SCHEMA_ROOT {SCHEMA_ROOT} does not exist', file=sys.stderr)
              sys.exit(1)
          print(f'SCHEMA_ROOT: {SCHEMA_ROOT}')
          # 2. Assert all schemas load
          sv = SchemaValidator()
          errors = sv.validate_all_schemas_loadable()
          if errors:
              print(f'ERROR: schema load errors: {errors}', file=sys.stderr)
              sys.exit(1)
          schema_count = len(list(SCHEMA_ROOT.rglob('*.json')))
          print(f'All {schema_count} schemas loaded successfully')
          # 3. Valid payload passes
          ref = 'nodechain://schemas/semantic_types/raw_user_query'
          valid_result = sv.validate({'query': 'release schema smoke'}, ref)
          if not valid_result:
              print(f'ERROR: valid payload rejected: {valid_result.errors}', file=sys.stderr)
              sys.exit(1)
          print('Valid payload accepted')
          # 4. Invalid payload fails with schema error, NOT 'Schema not found'
          invalid_result = sv.validate({'query': ''}, ref)
          if invalid_result:
              print('ERROR: invalid payload was accepted', file=sys.stderr)
              sys.exit(1)
          if any('Schema not found' in e for e in invalid_result.errors):
              print(f'ERROR: schema not found from installed wheel: {invalid_result.errors}', file=sys.stderr)
              sys.exit(1)
          print(f'Invalid payload correctly rejected: {invalid_result.errors}')
          "
