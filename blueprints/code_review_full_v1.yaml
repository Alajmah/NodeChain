chain_id: code-review-full-v1
name: Code Review Assistant with Patch Testing
version: "1.0.0"
description: >-
  Full governed code review: review → patch proposal → sandbox test execution.
  v2.71 review + v2.72 proposal + v2.73 governed temp-workspace test execution.
  Patches tested in isolated temp workspaces only. Real repo never modified.
goal: >-
  Review code, generate patch proposals, validate them, run tests in governed
  temp workspaces, and produce a complete traceable audit trail.

nodes:
  # v2.71 review path
  - node_id: code_review_request
    node_type: model
    position: 1
    config:
      model_required: true
      max_cost_usd: 0.10

  - node_id: file_reader
    node_type: deterministic
    position: 2
    config:
      allowed_paths:
        - "src/nodechain/**/*.py"
      git_access: read_only

  - node_id: code_analyzer
    node_type: model
    position: 3
    config:
      model_required: true
      max_cost_usd: 0.20

  - node_id: finding_classifier
    node_type: deterministic
    position: 4

  - node_id: review_report_generator
    node_type: model
    position: 5
    config:
      model_required: true
      max_cost_usd: 0.10

  # v2.72 patch proposal path
  - node_id: patch_generator
    node_type: model
    position: 6
    config:
      model_required: true
      max_cost_usd: 0.20

  - node_id: patch_validator
    node_type: deterministic
    position: 7
    config:
      allowed_paths:
        - "src/nodechain/**/*.py"

  - node_id: patch_risk_classifier
    node_type: deterministic
    position: 8

  # v2.73 sandbox test execution
  - node_id: sandbox_test_runner
    node_type: deterministic
    position: 9
    config:
      allowed_paths:
        - "src/nodechain/**/*.py"
      timeout_seconds: 120
      command_profile: pytest
      side_effects:
        - effect_type: code_execution
          target: temp_workspace
        - effect_type: external_call
          target: temp_workspace_pytest

  - node_id: test_result_classifier
    node_type: deterministic
    position: 10

connections:
  # v2.71 review
  - from_node: code_review_request
    from_port: code_review_goal
    to_node: file_reader
    to_port: code_review_goal
  - from_node: file_reader
    from_port: code_artifacts
    to_node: code_analyzer
    to_port: code_artifacts
  - from_node: code_analyzer
    from_port: review_findings
    to_node: finding_classifier
    to_port: review_findings
  - from_node: finding_classifier
    from_port: classified_findings
    to_node: review_report_generator
    to_port: classified_findings

  # v2.72 proposal
  - from_node: review_report_generator
    from_port: final_review
    to_node: patch_generator
    to_port: final_review
  - from_node: patch_generator
    from_port: patch_proposals
    to_node: patch_validator
    to_port: patch_proposals
  - from_node: patch_validator
    from_port: validated_patches
    to_node: patch_risk_classifier
    to_port: validated_patches

  # v2.73 test execution
  - from_node: patch_risk_classifier
    from_port: classified_patches
    to_node: sandbox_test_runner
    to_port: classified_patches
  - from_node: sandbox_test_runner
    from_port: sandbox_test_results
    to_node: test_result_classifier
    to_port: sandbox_test_results
